name: E2E

# Runs Playwright against the Vercel deployment that goes with this
# commit. Two trigger paths:
#
#   • pull_request → wait for Vercel's PR preview, run smoke + auth
#     tier against that preview URL. Status check shows up on the PR.
#   • push to main → wait for Vercel production deploy, run smoke
#     tier against production. Auth tier is skipped (production never
#     has TEST_AUTH_SECRET set, on purpose).
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   TEST_AUTH_SECRET   — same value as the Vercel Preview env var
#   MV_TEST_EMAIL      — Supabase test user email
#   MV_TEST_PASSWORD   — Supabase test user password
#
# Without those secrets the auth tier silently skips itself (see
# playwright.config.js — projects are conditionally registered) so
# this workflow remains green for forks and contributors who don't
# have credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel duplicate runs on rapid pushes — saves CI minutes and keeps
# the PR check from flapping.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright is intentionally NOT in package.json — Next 15.5
      # peer-deps Playwright as ^1.51.1 and pinning a different version
      # blocks `npm install` on Vercel. CI installs it ad-hoc.
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      # Block on Vercel's deployment for this exact commit. The
      # patrickedqvist action polls GitHub's deployment_status events
      # (which Vercel writes via its GitHub app) and outputs the URL
      # once status==success.
      - name: Wait for Vercel deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      - name: Run E2E suite
        run: npx playwright test
        env:
          PWPLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.url }}
          # Auth tier env: present only for Preview/PR runs because we
          # never want production hitting the test-auth endpoint.
          # On push-to-main, these secrets are still passed but the
          # production deploy returns 404 from /api/test-auth/login
          # (the route is gated by the env var being set on the
          # serving instance, not the calling client).
          TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET }}
          MV_TEST_EMAIL:    ${{ secrets.MV_TEST_EMAIL }}
          MV_TEST_PASSWORD: ${{ secrets.MV_TEST_PASSWORD }}
          CI: '1'

      # Upload trace + screenshot artifacts on failure so we can
      # debug without re-running locally. Retention 7 days is enough
      # to investigate within the typical PR review cycle.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
