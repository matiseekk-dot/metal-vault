name: E2E

# Runs Playwright against the Vercel deployment that goes with this
# commit. Two trigger paths:
#
#   • pull_request → wait for Vercel's PR preview, run smoke + auth
#     tier against that preview URL. Status check shows up on the PR.
#   • push to main → wait for Vercel production deploy, run smoke
#     tier against production. Auth tier is skipped (production never
#     has TEST_AUTH_SECRET set, on purpose).
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   TEST_AUTH_SECRET   — same value as the Vercel Preview env var
#   MV_TEST_EMAIL      — Supabase test user email
#   MV_TEST_PASSWORD   — Supabase test user password
#
# Without those secrets the auth tier silently skips itself (see
# playwright.config.js — projects are conditionally registered) so
# this workflow remains green for forks and contributors who don't
# have credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default GITHUB_TOKEN scope on this repo doesn't include pull-requests
# write, so the digest-posting step was getting 403 silently and never
# making a comment despite the step reporting "success" (curl -sS prints
# error to stderr, doesn't exit non-zero). Grant only what we need:
# read code, write to PR discussion, write deployment comments.
permissions:
  contents:      read
  pull-requests: write

# Cancel duplicate runs on rapid pushes — saves CI minutes and keeps
# the PR check from flapping.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright is intentionally NOT in package.json — Next 15.5
      # peer-deps Playwright as ^1.51.1 and pinning a different version
      # blocks `npm install` on Vercel. CI installs it ad-hoc.
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      # Wait for Vercel's deployment for THIS exact commit. We poll
      # GitHub's deployment-statuses API directly because the popular
      # third-party wait-for-vercel-preview action filters on the
      # "Preview" environment by default and ignores "Production"
      # deployments — push-to-main creates a Production deployment so
      # the action timed out at 10 min finding nothing.
      #
      # Polls every 10 s for up to 10 min. Accepts any state in
      # success / error / failure, then asserts state == "success"
      # so a failed Vercel build fails the workflow visibly instead
      # of silently passing.
      - name: Wait for Vercel deployment
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            depls=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=10")

            # Walk every deployment for this SHA until we find one
            # with a terminal status (success/error/failure).
            depl_count=$(echo "$depls" | jq 'length')
            for i in $(seq 0 $((depl_count - 1))); do
              depl_id=$(echo "$depls" | jq -r ".[$i].id")
              env_name=$(echo "$depls" | jq -r ".[$i].environment // \"\"")
              statuses=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${depl_id}/statuses?per_page=10")

              # Latest status is statuses[0] (API returns newest first).
              state=$(echo "$statuses" | jq -r '.[0].state // "pending"')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // .[0].target_url // ""')

              echo "deployment=$depl_id env=$env_name state=$state url=$url"

              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "error" ] || [ "$state" = "failure" ]; then
                echo "::error::Vercel deployment $depl_id ($env_name) reported state=$state — failing the E2E run."
                exit 1
              fi
            done

            echo "no terminal status yet — sleeping 10 s"
            sleep 10
          done
          echo "::error::Timed out waiting 10 min for any Vercel deployment status on ${SHA}."
          exit 1

      # The deployment-specific URL Vercel writes into target_url has
      # Vercel Authentication enabled (Project → Deployment Protection
      # → Vercel Authentication: "All Deployments"), so anonymous
      # requests get a 401 SSO redirect. For push-to-main runs we want
      # the public production alias instead. For pull_request runs we
      # keep the deployment URL — those need the bypass token (see
      # tests/e2e/README.md) or Deployment Protection disabled for
      # Preview to actually return the app.
      - name: Resolve test target URL
        id: target
        env:
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            url="https://metal-vault-six.vercel.app"
          else
            url="$VERCEL_URL"
          fi
          echo "Using $url for $EVENT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run E2E suite
        id: tests
        continue-on-error: true
        # set -o pipefail so the pipeline exit status reflects
        # Playwright's, not tee's. Without it a test failure was
        # masked behind tee's 0-exit and steps.tests.outcome stayed
        # "success" even on red runs.
        # Also echo discovered tests + config so we can diagnose
        # "0 tests run in 1 s" type results from the PR comment alone.
        run: |
          set -o pipefail
          echo "=== Test files in tests/e2e ==="
          ls -la tests/e2e/
          echo
          echo "=== AUTH_ENABLED flags ==="
          echo "TEST_AUTH_SECRET set: $([ -n \"${TEST_AUTH_SECRET:-}\" ] && echo yes || echo no)"
          echo "MV_TEST_EMAIL set:    $([ -n \"${MV_TEST_EMAIL:-}\" ] && echo yes || echo no)"
          echo "MV_TEST_PASSWORD set: $([ -n \"${MV_TEST_PASSWORD:-}\" ] && echo yes || echo no)"
          echo "BYPASS set:           $([ -n \"${VERCEL_AUTOMATION_BYPASS_TOKEN:-}\" ] && echo yes || echo no)"
          echo
          echo "=== Discovered tests (--list) ==="
          npx playwright test --list 2>&1 | tee /tmp/test-list.txt | head -80
          echo
          echo "=== Running ==="
          npx playwright test --reporter=list 2>&1 | tee /tmp/playwright-output.txt
        env:
          PWPLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.url }}
          # Auth tier env vars are passed ONLY on pull_request runs.
          # The /api/test-auth/login route on the serving instance is
          # gated by TEST_AUTH_SECRET being set on that deploy. The
          # secret only exists in Vercel's Preview environment (which
          # PR runs land on), never Production. So if we passed the
          # secrets to the workflow on a push-to-main run, the auth
          # tier would still register in playwright.config.js but
          # auth.setup.js would 404 against production /api/test-auth/login.
          # Empty values here → AUTH_ENABLED in playwright.config.js
          # is false → auth tier skips entirely → push-to-main runs
          # only the smoke tier against Production.
          TEST_AUTH_SECRET: ${{ github.event_name == 'pull_request' && secrets.TEST_AUTH_SECRET || '' }}
          MV_TEST_EMAIL:    ${{ github.event_name == 'pull_request' && secrets.MV_TEST_EMAIL    || '' }}
          MV_TEST_PASSWORD: ${{ github.event_name == 'pull_request' && secrets.MV_TEST_PASSWORD || '' }}
          # Vercel Deployment Protection bypass — needed for PR runs
          # which target the SSO-locked Preview URL. Production alias
          # is public so this is unused on push-to-main, but passing
          # it unconditionally is harmless (playwright.config.js only
          # adds the header if this is set anyway).
          VERCEL_AUTOMATION_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_TOKEN }}
          CI: '1'

      # Upload trace + screenshot artifacts on failure so we can
      # debug without re-running locally. Retention 7 days is enough
      # to investigate within the typical PR review cycle.
      - name: Upload Playwright report
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Post a digest as a PR comment regardless of pass/fail — keeps
      # us honest about WHAT actually ran (a previous green CI run was
      # actually 0 tests collected, masquerading as success). On
      # private repos the workflow log is admin-only, so PR comments
      # are the only failure-diagnostic surface available without
      # bouncing through the user.
      #
      # Uses actions/github-script (octokit-backed) instead of raw
      # curl. Two reasons:
      #   - automatic GITHUB_TOKEN auth dance with proper error
      #     reporting (curl was getting non-201 silently and the
      #     ::error:: line inside the log was admin-only readable)
      #   - JSON body construction stays in JS so we don't have to
      #     escape backticks / newlines through bash/jq
      - name: Post test digest as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, slice) => {
              try {
                const s = fs.readFileSync(p, 'utf8');
                return slice === 'tail' ? s.slice(-50000) : s.slice(0, 8000);
              } catch { return ''; }
            };
            const list = read('/tmp/test-list.txt', 'head');
            const out  = read('/tmp/playwright-output.txt', 'tail');
            const outcome = '${{ steps.tests.outcome }}';
            const icon  = outcome === 'failure' ? '❌' : '✅';
            const title = outcome === 'failure' ? 'failed' : 'passed';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const fence = '```';
            const body = [
              `${icon} **E2E run ${title}** — [run logs](${runUrl})`,
              ``,
              `<details><summary>discovered tests</summary>`,
              ``,
              fence,
              list || '(empty)',
              fence,
              ``,
              `</details>`,
              ``,
              `<details><summary>output (last 50KB)</summary>`,
              ``,
              fence,
              out || '(empty)',
              fence,
              ``,
              `</details>`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Make the workflow visibly red. Without this the
      # continue-on-error on the test step would let the run finish
      # green even when tests failed.
      - name: Fail run on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
